name: Publish Python Module

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish package
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/codepills

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Validate Code Pills metadata
        run: python codepills.py check

      - name: Run import smoke test
        run: |
          python -m pip install -e .
          python - <<'PY'
          import codepills
          import codepills.bename
          import codepills.browpic
          import codepills.dirinit
          import codepills.freezenv
          import codepills.massrun
          import codepills.pingwave
          import codepills.snippets
          import codepills.zipperzero
          PY

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
